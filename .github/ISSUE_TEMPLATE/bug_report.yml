name: Bug report
description: Report incorrect or unexpected Guardrail behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What behavior did you observe, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data only. Do not include secrets, customer data, or private configuration.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Guardrail version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.x
  - type: checkboxes
    id: hygiene
    attributes:
      label: Public-data check
      options:
        - label: I removed credentials, private data, private prompts, and proprietary configuration from this report.
          required: true
